# Builds and publishes a GitHub Release when a version tag (v1.2.3) is pushed:
# a universal macOS app (zip), a Windows exe (zip), a Linux amd64 binary (zip,
# built on Ubuntu with GTK4/WebKitGTK) and checksums.txt, with the tag's
# section of CHANGELOG.md as the notes. The app's updater reads these.
#
# Signing: with the secrets MACOS_CERT_P12 (a .p12 in base64) and
# MACOS_CERT_PASSWORD the bundle is signed with that certificate, so macOS
# keeps the Accessibility / Input Monitoring grants across updates. Without
# them it is signed ad hoc and macOS asks again after an update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: GTK4, WebKitGTK and an X server for the tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev xvfb xauth openbox xdotool dbus-x11 zip
      - run: go vet ./...
      - run: go test ./...
      - name: Build the Linux zip
        run: scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: dist/*.zip
          if-no-files-found: error
      # Last, as root: the pad tests make uinput devices and the window test needs X.
      - name: Device and window tests
        run: |
          sudo modprobe uinput
          sudo -E env "PATH=$PATH" "HOME=$HOME" VCD_REQUIRE_DEVICES=1 GSK_RENDERER=cairo WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 GTK_A11Y=none dbus-run-session -- xvfb-run -a sh -c 'openbox >/dev/null 2>&1 & exec go test ./internal/platform/ ./internal/app/'

  release:
    name: Build and publish
    needs: linux
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}
      # secrets cannot be read in a step's `if`; through the job env they can
      CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # find-identity without -v: a self-signed certificate is "not trusted", yet signs fine.
      - name: Import the signing certificate
        if: ${{ env.CERT_P12 != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk -F'"' '/^ +[0-9]+\)/ {print $2; exit}')"
          echo "VCD_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing with $IDENTITY"

      - name: Test
        run: go test ./...

      - name: Build the macOS app (universal)
        run: VCD_ARCHES="arm64 amd64" scripts/build-app.sh

      - name: Build the Windows app
        run: scripts/build-windows.sh

      - uses: actions/download-artifact@v4
        with:
          name: linux-zip
          path: dist

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent "Vibe Coder Deck.app" "Vibe-Coder-Deck-$VERSION-macos.zip"
          zip -q "vibe-coder-deck-$VERSION-windows-amd64.zip" vibe-coder-deck.exe
          shasum -a 256 *.zip > checksums.txt
          cat checksums.txt

      - name: Release notes from CHANGELOG.md
        run: |
          python3 - "$VERSION" <<'PY' > notes.md
          import re, sys
          v = sys.argv[1].lstrip('v')
          md = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[' + re.escape(v) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)', md, re.S | re.M)
          print((m.group(1).strip() if m else '') or f'Vibe Coder Deck v{v}')
          PY
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --title "Vibe Coder Deck $VERSION" --notes-file notes.md \
            dist/*.zip dist/checksums.txt
